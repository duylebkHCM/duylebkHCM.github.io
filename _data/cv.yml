    Projects:
      - name: "CONSTANT: One-Shot Handwriting Generation (Apr. 2024 – Apr. 2025)"
        summary: "Viettel AI; advisor: Tuan-Anh Tran; first-author research"
        highlights:
          - Addressed the difficulty of recovering a new writer's style from a single, potentially noisy sample. Proposed Style-Aware Quantization, which learns discrete visual style concepts instead of relying on fixed high-frequency features, with a contrastive objective to separate writers.
          - Introduced a multiscale latent patch contrastive objective that aligns generated and target patches during diffusion training, sharpening local stroke details in a single-stage framework.
          - On the IAM test set, SAQ reduced FID from 16.73 to 12.47; the full model reached FID 10.20 / HWD 0.74, respectively 36% / 30% lower than One-DM. Evaluated on English, Chinese, and Vietnamese handwriting.

      - name: "Hybrid Vision Transformer for Mathematical Expression Recognition (Jun. 2022 – Jun. 2023)"
        summary: "HCMUT; advisor: Tuan-Anh Tran; master's research"
        highlights:
          - Addressed long-range symbol relationships and missed or repeated symbols in formula parsing using a hybrid CNN–ViT encoder with 2D positional encoding and a coverage-attention decoder; achieved 89.94 BLEU-4 and 86.48% image exact match without spaces on IM2LATEX-100K.
          - "Extended the paper in my master's thesis by designing LIMD, a 1,564,755-pair image–LaTeX dataset, and building its collection, normalization, rendering, and outlier-filtering pipeline. [[Thesis]](https://doi.org/10.5281/zenodo.20427923)"

