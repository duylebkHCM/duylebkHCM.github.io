  location: Ho Chi Minh City, Vietnam
  image: ""
  summary: >
    I am an AI researcher and engineer working at the intersection of generative modeling,
    multimodal AI, and controllable visual generation. My research began with visual text
    intelligence—OCR, handwriting recognition, and mathematical expression recognition—and
    has evolved toward generative modeling, with recent work on one-shot handwriting generation
    using diffusion models. Alongside research, I have spent several years building production
    AI systems at Viettel AI, spanning OCR, eKYC, document processing, and generative data
    synthesis, which has shaped a research style focused on models that are both novel and
    practically robust. I am now interested in compositional and controllable generative AI:
    how generative models can compose multiple constraints at inference time, and how style,
    content, and structure can be represented modularly through diffusion models, energy-based
    models, and multimodal representations. My long-term goal is to contribute to generative
    AI systems that are high-quality, controllable, interpretable, and useful across real-world
    domains.

