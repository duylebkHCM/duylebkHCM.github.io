cv:
  name: Le Anh Duy
  label: AI Researcher & Engineer
  email: leanhduy497@gmail.com
  phone: "(+84) 349749495"
  location: Ho Chi Minh City, Vietnam
  image: ""
  summary: >
    My research began with recognizing content and two-dimensional structure in documents, and
    my current document VLM work extends that foundation in multimodal understanding. In one-shot
    handwriting generation, I learned discrete writer-style concepts from a single reference image
    to guide text-conditioned diffusion, motivating my interest in composing visual concepts from
    few examples. I want to build generative models that use vision-language understanding to
    interpret a creator's intent from language, sketches, reference images, and iterative feedback.
    My PhD goal is personalized image and video generation with control over composition,
    appearance, and motion while preserving identity and temporal consistency.

